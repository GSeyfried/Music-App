# Proposed cargo-deny policy. It is intentionally not enforced in CI until the
# current dependency graph has been reviewed against it.
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "0BSD",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]
