# macOS build verification on a GitHub-hosted runner.
# Manual trigger only (Actions › macOS build › Run workflow), so runner
# minutes are never spent without asking.
name: macOS build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Engine unit tests (no audio hardware on runners)
        run: cargo test -p voiceloop-engine
      - name: Compile Tauri shell
        run: cargo build -p voiceloop
      - name: Reference manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('reference-packages/manifest.json','utf8'))"
