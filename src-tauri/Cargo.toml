[package]
name = "voiceloop"
description = "VoiceLoop desktop shell (Tauri 2). Thin layer over voiceloop-engine."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "voiceloop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native open/save dialogs (MIT OR Apache-2.0; desktop + iOS/Android). See docs/projects/persistence/INTERFACE.md.
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
voiceloop-engine = { path = "../crates/voiceloop-engine" }
