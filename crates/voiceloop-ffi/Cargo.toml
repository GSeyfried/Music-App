[package]
name = "voiceloop-ffi"
description = "C interface to voiceloop-engine for native app shells (VoiceLoop Pocket, SwiftUI). JSON commands in, JSON events out; no Tauri."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "voiceloop_ffi"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
voiceloop-engine = { path = "../voiceloop-engine" }
