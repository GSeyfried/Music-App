# XcodeGen spec for VoiceLoop Pocket (SwiftUI app over the Rust engine).
# Generate the Xcode project:  npm run pocket:project
# Decision and layout: docs/projects/ios/SWIFT_APP.md
name: VoiceLoopPocket
options:
  bundleIdPrefix: dev.gseyfried
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig
targets:
  VoiceLoopPocket:
    type: application
    platform: iOS
    sources:
      - path: Sources
    preBuildScripts:
      - name: Build Rust engine
        script: '"$SRCROOT/../../scripts/build-pocket-engine.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: VoiceLoop Pocket
        PRODUCT_BUNDLE_IDENTIFIER: dev.gseyfried.voiceloop.pocket
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pocket
        INFOPLIST_KEY_NSMicrophoneUsageDescription: VoiceLoop Pocket listens to your voice to turn beatboxing into drum hits and to record your songs. Audio stays on this device.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Engine/VoiceLoop-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../../crates/voiceloop-ffi/include
        OTHER_LDFLAGS: -lvoiceloop_ffi
        RUST_PROFILE_DIR: debug
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/../../target/aarch64-apple-ios-sim/$(RUST_PROFILE_DIR)
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/../../target/aarch64-apple-ios/$(RUST_PROFILE_DIR)
      configs:
        Release:
          RUST_PROFILE_DIR: release
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreMIDI.framework
      - sdk: Foundation.framework
