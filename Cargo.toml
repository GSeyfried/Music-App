[workspace]
resolver = "2"
members = ["crates/voiceloop-engine", "src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.dev.package."*"]
# Optimise dependencies (cpal, DSP) even in dev builds so audio callbacks are not starved.
opt-level = 2
