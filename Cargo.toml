[workspace]
resolver = "2"
members = ["crates/voiceloop-analysis", "crates/voiceloop-engine", "crates/voiceloop-project", "src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.dev.package."*"]
# Optimise dependencies (cpal, DSP) even in dev builds so audio callbacks are not starved.
opt-level = 2

# `"*"` does not cover workspace members. Unoptimised, the looper callback and
# pitch analysis are 10-30x slower, which is enough to cause dropouts in `tauri dev`.
[profile.dev.package.voiceloop-engine]
opt-level = 2

[profile.dev.package.voiceloop-analysis]
opt-level = 3

# File I/O, resampling, and offline rendering run on worker threads; optimise
# them so saving a session does not take seconds in `tauri dev`.
[profile.dev.package.voiceloop-project]
opt-level = 2
